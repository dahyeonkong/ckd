<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Design Implementation</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f5f8;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, #dbeafe 0%, transparent 30%), var(--bg);
        color: var(--text);
      }

      .modal {
        width: min(100%, 460px);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 32px 28px 28px;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: #f3f4f6;
        color: #374151;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .close-btn:hover {
        background: #e5e7eb;
      }

      .title {
        margin: 0 0 24px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .primary-btn {
        width: 100%;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 14px;
        padding: 14px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
        color: #111827;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
      }

      .google-btn {
        margin-bottom: 20px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0 18px;
        color: var(--muted);
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .email-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .email-label {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
      }

      .email-input {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--border);
        padding: 13px 14px;
        font-size: 15px;
        color: var(--text);
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .email-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .continue-btn {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 700;
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease;
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
      }

      .continue-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.25);
      }

      @media (max-width: 520px) {
        .modal {
          padding: 28px 20px 24px;
          border-radius: 20px;
        }

        .title {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="modal" role="dialog" aria-labelledby="signup-title">
      <button class="close-btn" aria-label="닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <h1 class="title" id="signup-title">멀티플레이어 도구를 사용하려면 가입하세요.</h1>

      <button class="primary-btn google-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.73-.06-1.43-.18-2.1H12v3.97h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.99-4.33 2.99-7.39Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.5c-.9.6-2.05.95-3.39.95-2.6 0-4.8-1.76-5.59-4.12H3.08v2.58A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.41 13.9a5.99 5.99 0 0 1 0-3.8V7.52H3.08a10 10 0 0 0 0 12.76l3.33-2.38Z"/>
          <path fill="#EA4335" d="M12 6.06c1.47 0 2.78.5 3.82 1.48l2.86-2.86A9.97 9.97 0 0 0 12 2 10 10 0 0 0 3.08 7.52l3.33 2.58C7.2 7.82 9.4 6.06 12 6.06Z"/>
        </svg>
        Google 계정으로 계속하기
      </button>

      <div class="divider">또는</div>

      <label class="email-group" for="email">
        <span class="email-label">이메일</span>
        <input class="email-input" id="email" type="email" placeholder="name@example.com" />
      </label>

      <button class="continue-btn" type="button">이메일로 계속하기</button>
    </main>
  </body>
</html>
